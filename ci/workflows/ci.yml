name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Type-check and build the UI
        run: npm run build
      - name: Check the Rust crate (all targets)
        run: cargo check --manifest-path src-tauri/Cargo.toml --tests --examples
      - name: Run tests (SMB tests self-skip without a server)
        run: cargo test --manifest-path src-tauri/Cargo.toml --tests
