<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="slot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a5fe0"/>
      <stop offset="1" stop-color="#5b3fd6"/>
    </linearGradient>
  </defs>
  <!-- macOS-style rounded tile with ~10% margin -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#gloss)"/>
  <!-- NAS body -->
  <rect x="242" y="322" width="540" height="380" rx="72" fill="#ffffff"/>
  <!-- two bays -->
  <rect x="302" y="382" width="420" height="110" rx="34" fill="url(#slot)"/>
  <rect x="302" y="532" width="420" height="110" rx="34" fill="url(#slot)"/>
  <!-- bay grips -->
  <rect x="342" y="428" width="160" height="18" rx="9" fill="#ffffff" fill-opacity="0.55"/>
  <rect x="342" y="578" width="160" height="18" rx="9" fill="#ffffff" fill-opacity="0.55"/>
  <!-- activity lights -->
  <circle cx="676" cy="437" r="19" fill="#5cf2a8"/>
  <circle cx="676" cy="587" r="19" fill="#ffffff" fill-opacity="0.9"/>
</svg>
