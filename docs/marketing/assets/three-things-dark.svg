<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b83ff"/><stop offset="1" stop-color="#8a5bff"/></linearGradient>
<linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5b83ff"/><stop offset="1" stop-color="#8a5bff"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="rgba(0,0,0,0.6)"/></filter>
</defs>
<rect width="1600" height="800" fill="#101012"/>
<rect x="80" y="80" width="56" height="56" rx="13.44" fill="url(#g)"/>
<g transform="translate(92.32,93.44)" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
  <rect x="0" y="0" width="31.360000000000003" height="11.200000000000001" rx="3.36"/><rect x="0" y="17.92" width="31.360000000000003" height="11.200000000000001" rx="3.36"/>
  <circle cx="6.16" cy="5.6000000000000005" r="1.12" fill="#fff"/><circle cx="6.16" cy="23.52" r="1.12" fill="#fff"/>
</g>
<text x="152" y="120" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', 'PingFang SC', Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#f3f3f5">Neat NAS</text>
<text x="80" y="230" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', 'PingFang SC', Inter, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-2.5" fill="#f3f3f5">Three things you will <tspan fill="url(#t)">never type again</tspan>.</text>
<text x="80" y="290" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', 'PingFang SC', Inter, Arial, sans-serif" font-size="24" fill="#a5a5ad">Every NAS session used to start the same way. Neat NAS keeps all three, safely, and skips straight to your files.</text>
<g filter="url(#sh)"><rect x="80" y="380" width="460" height="300" rx="22" fill="#1a1a1e" stroke="#2c2c31"/></g>
<text x="116" y="446" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#78787f" text-decoration="line-through">192.168.1.126</text>
<text x="116" y="520" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', 'PingFang SC', Inter, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-1" fill="#f3f3f5">The address</text>
<text x="116" y="572" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', 'PingFang SC', Inter, Arial, sans-serif" font-size="20" fill="#a5a5ad"><tspan x="116" dy="0">Found on the network and remembered;</tspan><tspan x="116" dy="28">it even survives a router reboot.</tspan></text><g filter="url(#sh)"><rect x="580" y="380" width="460" height="300" rx="22" fill="#1a1a1e" stroke="#2c2c31"/></g>
<text x="616" y="446" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#78787f" text-decoration="line-through">admin</text>
<text x="616" y="520" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', 'PingFang SC', Inter, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-1" fill="#f3f3f5">The user name</text>
<text x="616" y="572" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', 'PingFang SC', Inter, Arial, sans-serif" font-size="20" fill="#a5a5ad"><tspan x="616" dy="0">Saved with the NAS,</tspan><tspan x="616" dy="28">edited in one click.</tspan></text><g filter="url(#sh)"><rect x="1080" y="380" width="460" height="300" rx="22" fill="#1a1a1e" stroke="#2c2c31"/></g>
<text x="1116" y="446" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#78787f" text-decoration="line-through">••••••••••</text>
<text x="1116" y="520" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', 'PingFang SC', Inter, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-1" fill="#f3f3f5">The password</text>
<text x="1116" y="572" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', 'PingFang SC', Inter, Arial, sans-serif" font-size="20" fill="#a5a5ad"><tspan x="1116" dy="0">Kept in the system keychain,</tspan><tspan x="1116" dy="28">never in a text file.</tspan></text>
</svg>