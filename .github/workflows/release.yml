name: Release

# Push a tag like v1.0.0 to build installers for macOS (universal) and
# Windows (x64), attach them to a draft GitHub release, and publish the
# updater manifest (latest.json) when signing secrets are configured.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin
          - name: Windows x64
            os: windows-latest
            args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifact signing (see RELEASE.md)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing + notarization (optional until you have an Apple Developer account)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Neat NAS ${{ github.ref_name }}"
          releaseBody: "Download the installer for your platform below. macOS: open the .dmg and drag Neat NAS to Applications. Windows: run the .exe installer. The .zip files hold the same app without an installer."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
      # The same app without an installer, attached next to the .dmg and .exe.
      - name: Attach the zipped app (macOS)
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          zip="Neat NAS_${version}_universal-mac.zip"
          ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/universal-apple-darwin/release/bundle/macos/Neat NAS.app" "$zip"
          gh release upload "$GITHUB_REF_NAME" "$zip" --clobber --repo "$GITHUB_REPOSITORY"
      - name: Attach the zipped app (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $zip = "Neat NAS_${version}_x64-win.zip"
          # Take the exe from the installer: that copy carries the NSIS marker the updater reads.
          7z e "src-tauri/target/release/bundle/nsis/Neat NAS_${version}_x64-setup.exe" neatnas.exe -oportable -y | Out-Null
          Rename-Item "portable/neatnas.exe" "Neat NAS.exe"
          Compress-Archive -LiteralPath "portable/Neat NAS.exe" -DestinationPath $zip -Force
          gh release upload $env:GITHUB_REF_NAME $zip --clobber --repo $env:GITHUB_REPOSITORY
