name: Release

# Pushed tags (scripts/release.sh pushes them) build the Windows installer and
# zip here and attach them to a draft release. The macOS app is built, signed
# with the Developer ID and notarized on the maintainer's Mac by the same
# script, so the signing key never leaves that Mac; see RELEASE.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Build (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifact signing (see RELEASE.md)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Neat NAS ${{ github.ref_name }}"
          releaseBody: "Download the installer for your platform below. macOS: open the .dmg and drag Neat NAS to Applications. Windows: run the .exe installer. The .zip files hold the same app without an installer."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          # NSIS only, as local builds and earlier releases, so updates always use the same installer.
          args: --bundles nsis
      # The same app without an installer, attached next to the .exe.
      - name: Attach the zipped app
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $zip = "Neat NAS_${version}_x64-win.zip"
          # Take the exe from the installer: that copy carries the NSIS marker the updater reads.
          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe" }
          & $sevenZip e "src-tauri/target/release/bundle/nsis/Neat NAS_${version}_x64-setup.exe" neatnas.exe -oportable -y | Out-Null
          if (-not (Test-Path "portable/neatnas.exe")) { throw "could not extract neatnas.exe from the installer" }
          Rename-Item "portable/neatnas.exe" "Neat NAS.exe"
          Compress-Archive -LiteralPath "portable/Neat NAS.exe" -DestinationPath $zip -Force
          gh release upload $env:GITHUB_REF_NAME $zip --clobber --repo $env:GITHUB_REPOSITORY
