[package]
name = "neatnas"
version = "1.0.4"
description = "A modern SMB NAS browser for Mac and Windows"
authors = ["Neat NAS contributors"]
license = "MIT"
repository = "https://github.com/jason-jm/neat-nas"
homepage = "https://jason-jm.github.io/neat-nas/"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "neatnas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The in-app updater pulls in an HTTP client with C sources (ring); keep it
# switchable so the crate can be cross-checked without a Windows C toolchain.
default = ["updater"]
updater = ["dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smb2 = "0.22"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
mdns-sd = "0.21.3"
tauri-plugin-dialog = "2"
thiserror = "2"
log = "0.4.34"
env_logger = "0.11.11"
uuid = { version = "1.26.1", features = ["v4"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
kamadak-exif = "0.6.1"
percent-encoding = "2.3.2"
mime_guess = "2.0.5"
http-range = "0.1.5"
http = "1.5.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
base64 = "0.23.1"
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSError", "NSGeometry", "NSObject", "NSOperation", "NSString", "NSURL", "NSDictionary", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSApplication", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSFilePromiseProvider", "NSGraphics", "NSImage", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSToolbar", "NSView", "NSWindow", "NSWorkspace", "NSRunningApplication", "NSGraphicsContext"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
